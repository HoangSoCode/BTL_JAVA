spring.application.name=BTL-JAVA
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# =====================================================================
# CSDL MẶC ĐỊNH: H2 lưu ra file ./data/restaurant_db  -> chạy ngay, KHÔNG cần cài MySQL
# Muốn dùng MySQL:  chạy với profile "mysql" (xem application-mysql.properties)
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/restaurant_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# ---- Cấu hình tìm kiếm ----
# Vị trí mặc định (khi chưa bấm "Dùng vị trí của tôi") - mặc định: Học viện Công nghệ Bưu chính Viễn thông (Hà Nội)
app.search.default-lat=20.96667
app.search.default-lng=105.78333
app.search.default-radius-km=5
app.search.max-radius-km=50
app.search.default-page-size=9
app.search.max-page-size=50
# Tự động nạp dữ liệu mẫu khi bảng rỗng
app.seed.enabled=true
spring.thymeleaf.cache=false
