# Dùng MySQL:  mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Cần MySQL đang chạy ở localhost:3306. Database "restaurant_db" sẽ tự được tạo.
# Đổi user/mật khẩu bằng biến môi trường DB_USERNAME / DB_PASSWORD (hoặc sửa trực tiếp dưới đây).
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
